name: Manual RDS Restore from Snapshot

# Trigger the workflow manually from the Actions tab
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment'
        required: true
        type: choice
        options:
          - sandbox
          - dev
          - production
        default: 'sandbox'
      source_instance_id:
        description: 'Source RDS Instance ID'
        required: true
        type: string
      snapshot_id:
        description: 'RDS Snapshot ID to restore from'
        required: true
        type: string
      create_backup_db:
        description: 'Create backup DB?'
        required: false
        type: choice
        options:
          - 'No'
          - 'Yes'
        default: 'Yes'
      apply_migration:
        description: 'Apply Database Migrations after restore?'
        required: false
        type: choice
        options:
          - 'No'
          - 'Yes'
        default: 'No'

jobs:
  rds-restore:
    environment: ${{ github.event.inputs.environment == 'development' && 'development' || github.event.inputs.environment == 'sandbox' && format('{0}_sandbox', github.actor) || github.event.inputs.environment == 'production' && 'production' || '' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set Environment Variable
        run: echo "ENVIRONMENT=${{ github.event.inputs.environment }}" >> $GITHUB_ENV

      - name: Set up SSH Key
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          cd infra
          . ./load-secrets.sh
          echo "LOADED BASTION_HOST_IP: ${BASTION_HOST_IP}"
          echo "LOADED DATABASE_HOSTNAME: ${DATABASE_HOSTNAME}"
          cd ..
          echo "DATABASE_PASSWORD=$DATABASE_PASSWORD" >> $GITHUB_ENV
          echo "::add-mask::${DATABASE_PASSWORD}"
          echo "DJANGO_SUPERUSER_PASSWORD=$DJANGO_SUPERUSER_PASSWORD" >> $GITHUB_ENV
          echo "::add-mask::${DJANGO_SUPERUSER_PASSWORD}"
          echo "SECRET_KEY=$SECRET_KEY" >> $GITHUB_ENV
          echo "::add-mask::${SECRET_KEY}"
          echo "DATABASE_HOSTNAME=$DATABASE_HOSTNAME" >> $GITHUB_ENV
          echo "::add-mask::${DATABASE_HOSTNAME}"
          echo "BASTION_HOST_IP=$BASTION_HOST_IP" >> $GITHUB_ENV
          echo "::add-mask::${BASTION_HOST_IP}"
          mkdir -p .ssh
          echo "${BASTION_PRIVATE_KEY}" | base64 --decode > .ssh/id_rsa
          chmod 600 .ssh/id_rsa

      - name: Run RDS Restore Script
        if: github.event.inputs.create_backup_db == 'Yes'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        shell: bash
        run: |
          ./infra/restore-rds.sh \
            "${{ github.event.inputs.source_instance_id }}" \
            "${{ github.event.inputs.snapshot_id }}"

      - name: Run Migrations (Conditional)
        if: github.event.inputs.apply_migration == 'Yes'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          echo "Changing to website directory..."
          cd website || { echo "Failed to cd into website"; exit 1; }
          # set -e # Temporarily disable or keep it and rely on || {} blocks

          echo "Bastion Host IP: ${BASTION_HOST_IP}"
          echo "Database Hostname: ${DATABASE_HOSTNAME}"
          echo "Scanning bastion host key..."
          ssh-keyscan -H ${BASTION_HOST_IP} > /tmp/known_hosts || { echo "ssh-keyscan failed"; exit 1; }
          echo "Host key scanned."

          echo "Starting SSH tunnel..."
          # Use -f to background properly after potential authentication
          ssh -vvv -o StrictHostKeyChecking=no -o UserKnownHostsFile=/tmp/known_hosts -L 5432:${DATABASE_HOSTNAME}:5432 -f -N -i ../.ssh/id_rsa ubuntu@${BASTION_HOST_IP} || { echo "SSH command failed immediately"; exit 1; }
          echo "SSH command executed. Waiting for tunnel..."
          sleep 5 # Give tunnel a moment to establish or fail

          # Optional: Test tunnel connection if you have netcat or psql client
          # echo "Testing tunnel connection..."
          # nc -zv localhost 5432 || { echo "Tunnel test connection failed (nc)"; exit 1; }

          echo "Exporting DATABASE_URL..."
          export DATABASE_URL="postgresql://master:${DATABASE_PASSWORD}@localhost:5432/postgres"
          echo "DATABASE_URL set."

          echo "Running make migrate..."
          make migrate || { echo "make migrate FAILED"; exit 1; }
          echo "make migrate completed."

          echo "Running make createpages..."
          make createpages settings="app.settings.${ENVIRONMENT}" || { echo "make createpages FAILED"; exit 1; }
          echo "make createpages completed."

          echo "Migration step finished successfully."
